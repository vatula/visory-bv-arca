[project]
name = "arcra-backend"
version = "0.1.0"
description = "ARCRA Backend — FastAPI + Pydantic Graph agentic engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai-slim[bedrock]",
    "pydantic-ai",
    "pydantic-graph",
    "pydantic-settings",
    "fastapi[standard]",
    "structlog",
    "aiosqlite",
    "httpx",
    "mcp",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
    "mypy>=1.10",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "Q"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
