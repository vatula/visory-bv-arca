[pytest]
# ---------------------------------------------------------------------------
# Phase 7 — E2E Prompt Evaluation & LLM Testing
#
# Run with:  cd backend && pytest -c pytest_e2e.ini
#
# These tests call the real BedrockConverseModel and require valid AWS
# credentials.  They are intentionally isolated from the unit-test suite
# (pyproject.toml testpaths = ["tests"]) because they are slower and incur
# AWS billing costs.
# ---------------------------------------------------------------------------
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests_e2e
pythonpath = .
