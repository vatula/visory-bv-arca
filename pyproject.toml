[project]
name = "arcra"
version = "0.1.0"
description = "Autonomous Reconciliation and Contextual Resolution Agent (ARCRA) - agentic workflow orchestration engine, powered by MCP, that detects anomalies in the Xero ledger and autonomously navigates external enterprise tools to gather context, resolve ambiguity, and prepare the transaction for final human approval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai-slim[bedrock]",
    "pydantic-ai",
    "pydantic-graph",
    "fastapi",
    "structlog",
    "mcp",
    "httpx",
    "pydantic-settings",
    "aiosqlite",
    "dotenv"
]

[tool.uv]
managed = true

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator", "src/mcp_mesh"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "mypy",
    "ruff>=0.15.6"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "Q", "PLC0415", "F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
